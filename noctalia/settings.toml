config_version = 8

[audio]
enable_overdrive = true

[bar.default]
capsule = true
capsule_padding = 12.0
center = [ "audio_visualizer", "workspaces" ]
concave_edge_corners = false
end = [ "tray", "group:g2", "clock", "session" ]
margin_edge = 12
radius = 16
scale = 1.2000000104308128
start = [ "control-center", "temp" ]
thickness = 38

    [[bar.default.capsule_group]]
    enabled = true
    fill = "surface_variant"
    id = "g2"
    members = [ "network", "bluetooth", "volume", "brightness", "battery" ]
    opacity = 1.0
    padding = 6.0

[control_center]
sidebar = "full"
width = 800

[desktop_widgets]
schema_version = 2
widget_order = [ "desktop-widget-0000000000000001" ]

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget.desktop-widget-0000000000000001]
    box_height = 0.0
    box_width = 0.0
    cx = 640.0
    cy = 400.0
    output = "eDP-2"
    rotation = 0.0
    type = "fancy_audio_visualizer"

        [desktop_widgets.widget.desktop-widget-0000000000000001.settings]
        background = false
        background_color = "surface"
        background_opacity = 0.80000000000000004
        background_padding = 10
        background_radius = 12
        bar_width = 0.59999999999999998
        bloom_intensity = 0.5
        fade_when_idle = true
        inner_diameter = 0.69999999999999996
        primary_color = "primary"
        ring_opacity = 0.80000000000000004
        rotation_speed = 0.5
        secondary_color = "secondary"
        sensitivity = 1.1000000000000001
        visualization_mode = "wave_rings"
        wave_thickness = 1.0

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 600.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = false
    timeout = 900.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 660.0

[location]
latitude = 36.68
longitude = 117.11

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-2", "lockscreen-widget-0000000000000001", "lockscreen-widget-0000000000000002" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-2"]
    box_height = 196.0
    box_width = 810.0
    cx = 640.0
    cy = 686.0
    output = "eDP-2"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-2".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000001]
    box_height = 160.0
    box_width = 352.0
    cx = 640.0
    cy = 144.0
    output = "eDP-2"
    rotation = 0.0
    type = "clock"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000001.settings]
        background = false
        center_text = true
        clock_style = "digital"
        color = "primary"
        shadow = true

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000002]
    box_height = 256.0
    box_width = 240.0
    cx = 640.0
    cy = 384.0
    output = "eDP-2"
    rotation = 0.0
    type = "fancy_audio_visualizer"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000002.settings]
        background = false
        sensitivity = 1.0
        visualization_mode = "wave_rings"

[plugin_settings."noctalia/notes"]
notes_dir = "/home/x68/文档/Notes"
panel_open_near_click = true

[plugins]
enabled = [ "noctalia/notes", "noctalia/mpvpaper" ]

[shell]
niri_overview_type_to_launch_enabled = true

    [shell.animation]
    speed = 0.65000000968575478

    [shell.launcher]
    app_grid = true

    [shell.panel]
    control_center_placement = "floating"
    launcher_position = "auto"
    open_near_click_control_center = true
    open_near_click_session = true
    session_placement = "floating"

    [shell.session]
    show_shortcuts = false

        [[shell.session.actions]]
        action = "lock"
        countdown_seconds = 0.0
        enabled = true
        shortcut = "1"
        variant = "default"

        [[shell.session.actions]]
        action = "logout"
        countdown_seconds = 0.0
        enabled = true
        shortcut = "2"
        variant = "default"

        [[shell.session.actions]]
        action = "reboot"
        countdown_seconds = 0.0
        enabled = true
        shortcut = "4"
        variant = "default"

        [[shell.session.actions]]
        action = "shutdown"
        countdown_seconds = 0.0
        enabled = true
        shortcut = "5"
        variant = "destructive"

        [[shell.session.actions]]
        action = "lock_and_suspend"
        countdown_seconds = 0.0
        enabled = false
        shortcut = "3"
        variant = "default"

[theme]
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "faithful"

    [theme.templates]
    builtin_ids = [ "foot", "niri" ]

[wallpaper]
directory = "/home/x68/图片/wallpaper"
transition_on_startup = true

    [wallpaper.automation]
    enabled = true

    [wallpaper.default]
    path = "/home/x68/图片/wallpaper/37971AA251A5C9B4D92E65D675EEE12E.png"

    [wallpaper.last]
    path = "/home/x68/图片/wallpaper/37971AA251A5C9B4D92E65D675EEE12E.png"

    [wallpaper.monitors.eDP-2]
    path = "/home/x68/图片/wallpaper/37971AA251A5C9B4D92E65D675EEE12E.png"

[weather]
effects = false

[widget.battery]
show_label = false

[widget.brightness]
show_label = false

[widget.clock]
format = "{:%H:%M:%S}"

[widget.launcher]
enabled = false

[widget.network]
