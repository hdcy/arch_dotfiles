[bar.default]
capsule = true
capsule_padding = 12.0
center = [ "weather", "workspaces", "audio_visualizer" ]
concave_edge_corners = false
end = [ "tray", "group:g2", "clock", "session" ]
margin_edge = 6
radius = 16
start = [ "control-center", "temp" ]

    [[bar.default.capsule_group]]
    enabled = true
    fill = "surface_variant"
    id = "g2"
    members = [ "network", "bluetooth", "volume", "brightness", "battery" ]
    opacity = 1.0
    padding = 6.0

[control_center]
sidebar = "full"
width = 800

[location]
latitude = 36.68
longitude = 117.11

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-2" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-2"]
    box_height = 229.0
    box_width = 810.0
    cx = 854.0
    cy = 868.5
    output = "eDP-2"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-2".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_weather = true

[shell]
niri_overview_type_to_launch_enabled = true

    [shell.launcher]
    categories = false

    [shell.panel]
    control_center_placement = "floating"
    open_near_click_control_center = true
    open_near_click_session = true
    session_placement = "floating"

    [shell.session]
    show_shortcuts = false

        [[shell.session.actions]]
        action = "lock"
        countdown_seconds = 0.0
        enabled = true
        shortcut = "1"
        variant = "default"

        [[shell.session.actions]]
        action = "logout"
        countdown_seconds = 0.0
        enabled = true
        shortcut = "2"
        variant = "default"

        [[shell.session.actions]]
        action = "reboot"
        countdown_seconds = 0.0
        enabled = true
        shortcut = "4"
        variant = "default"

        [[shell.session.actions]]
        action = "shutdown"
        countdown_seconds = 0.0
        enabled = true
        shortcut = "5"
        variant = "destructive"

        [[shell.session.actions]]
        action = "lock_and_suspend"
        countdown_seconds = 0.0
        enabled = false
        shortcut = "3"
        variant = "default"

[theme]
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "dysfunctional"

    [theme.templates]
    builtin_ids = [ "foot" ]

[wallpaper]
directory = "/home/x68/图片/wallpaper"

    [wallpaper.automation]
    enabled = true

    [wallpaper.default]
    path = "/home/x68/图片/wallpaper/illust_116733031_20240625_003948.png"

    [wallpaper.last]
    path = "/home/x68/图片/wallpaper/illust_116733031_20240625_003948.png"

    [wallpaper.monitors.eDP-2]
    path = "/home/x68/图片/wallpaper/illust_116733031_20240625_003948.png"

[weather]
effects = false

[widget.battery]
show_label = false

[widget.brightness]
show_label = false

[widget.clock]
format = "{:%H:%M:%S}"

[widget.launcher]
enabled = false

[widget.network]
show_label = false
vpn_status = "both"

[widget.tray]
hidden = [ "网络" ]

[widget.volume]
show_label = false

[widget.wallpaper]
enabled = false

[widget.workspaces]
anchor = true
display = "none"
